<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Arrow Escape</title>
<style>
:root {
    --primary: #1877F2;
    --arrow: #07193B;
    --error: #FF473E;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --pill: #F1F4F9;
    --text: #081838;
    --muted: #5B6880;
    --dot: #E2E8F0;
    --scrim: rgba(8, 24, 56, 0.45);
    --shadow: 0 6px 20px rgba(8, 24, 56, 0.12);
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
    transition: transform 0.15s ease, opacity 0.15s ease;
}
button:active { transform: scale(0.95); }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.icon { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.screen {
    position: absolute;
    inset: 0;
    height: 100dvh;
    display: none;
    flex-direction: column;
    background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.active { display: flex; }

/* Game screen */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 8px 12px 0;
}
.topbar .title { font-size: 21px; font-weight: 700; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; color: var(--primary); border-radius: 50%; }

.stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 8px 20px;
}
.pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 68px;
    justify-content: center;
    background: var(--pill);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 16px;
    font-weight: 600;
}
.pill .icon { width: 18px; height: 18px; }
.hearts { display: flex; gap: 8px; }
.heart { width: 28px; height: 28px; fill: var(--error); transition: fill 0.25s ease; }
.heart.lost { fill: var(--dot); }
.heart.pop { animation: pop 0.35s ease; }
@keyframes pop { 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

.board-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 24px;
}
#board {
    display: block;
    overflow: visible;
    touch-action: none;
    cursor: pointer;
}
.dots { fill: var(--dot); }
.arrow .shaft { fill: none; stroke: var(--arrow); stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.12s ease; }
.arrow .head { fill: var(--arrow); stroke: var(--arrow); stroke-linejoin: round; transition: fill 0.12s ease, stroke 0.12s ease; }
.arrow.err .shaft { stroke: var(--error); }
.arrow.err .head { fill: var(--error); stroke: var(--error); }
.arrow.out .shaft { stroke: var(--primary); }
.arrow.out .head { fill: var(--primary); stroke: var(--primary); }

/* Modals */
.modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--scrim);
}
.modal.open { display: flex; animation: fade 0.2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.card {
    width: 100%;
    max-width: 360px;
    max-height: calc(100dvh - 32px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 20px;
    animation: rise 0.25s ease;
}
@keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head h3 { margin: 0; font-size: 20px; }
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    font-weight: 700;
    background: var(--pill);
    color: var(--text);
}
.btn.primary { background: var(--primary); color: #FFFFFF; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.center { text-align: center; }

.level-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    overflow-y: auto;
    padding: 4px;
    min-height: 0;
    flex: 1;
}
.level-btn { border-radius: 16px; background: var(--pill); font-weight: 700; padding: 12px 0; }
.level-btn.current { background: var(--primary); color: #FFFFFF; }

/* Victory */
.victory { background: #1B8BFF; color: #FFFFFF; flex-direction: column; overflow: hidden; }
.victory h2 { font-size: 34px; margin: 0 0 24px; position: relative; }
.victory .mini-card { width: 240px; height: 240px; background: #FFFFFF; border-radius: 32px; padding: 20px; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
.victory .mini-card svg { width: 100%; height: 100%; }
.victory .mini-card .arrow .shaft { stroke: #07193B; }
.victory .mini-card .arrow .head { fill: #07193B; stroke: #07193B; }
.pill-btn { position: relative; background: #FFFFFF; color: var(--primary); border-radius: 999px; padding: 12px 40px; font-weight: 800; font-size: 18px; box-shadow: var(--shadow); }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>

<!-- Game screen -->
<div id="screen-game" class="screen active">
    <div class="topbar">
        <button class="icon-btn" id="btn-levels" aria-label="Levels">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="title">Level <span id="level-display">1</span></div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </div>
    <div class="stats">
        <div class="pill">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span id="remaining-display">0</span>
        </div>
        <div class="hearts" id="hearts"></div>
        <div class="pill" id="diff-badge">Normal</div>
    </div>
    <div class="board-wrap" id="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
</div>

<!-- Level select -->
<div class="modal" id="modal-levels">
    <div class="card">
        <div class="card-head">
            <h3>Select Level</h3>
            <button class="icon-btn" data-close aria-label="Close">
                <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="level-grid" id="level-grid"></div>
    </div>
</div>

<!-- Settings -->
<div class="modal" id="modal-settings">
    <div class="card">
        <div class="card-head">
            <h3>Settings</h3>
            <button class="icon-btn" data-close aria-label="Close">
                <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="stack">
            <button class="btn" id="btn-restart">Restart Level</button>
            <button class="btn" id="btn-audio">Sound: ON</button>
        </div>
    </div>
</div>

<!-- Game over -->
<div class="modal" id="modal-gameover">
    <div class="card center">
        <h3>Out of Hearts!</h3>
        <p>Look for arrows with a clear path ahead of their tip.</p>
        <button class="btn primary" id="btn-tryagain">Try Again</button>
    </div>
</div>

<!-- Victory -->
<div class="modal victory" id="modal-victory">
    <canvas id="confetti"></canvas>
    <h2>Level Completed!</h2>
    <div class="mini-card"><svg id="mini-board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <button class="pill-btn" id="btn-next">Next Level</button>
</div>

<!-- ===================== ENGINE (pure: seeded RNG, generator, solver) ===================== -->
<script id="engine">
/* ===== ENGINE: pure functions only (no DOM). Tested by tests/generator.test.js ===== */

/* ---------- Config ---------- */
const DIRS = [
    { dr: -1, dc: 0, rot: 0 },   // up
    { dr: 0, dc: 1, rot: 90 },   // right
    { dr: 1, dc: 0, rot: 180 },  // down
    { dr: 0, dc: -1, rot: 270 }  // left
];
const MASK_SHAPES = ['heart', 'circle', 'diamond', 'hourglass', 'star'];
const MIN_LEN = 2;
const MAX_LEN = 20;
const MIN_FILL = 0.9;

/* ---------- Seeded RNG ---------- */

/* mulberry32: small, fast, deterministic PRNG returning floats in [0, 1). */
function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

/* Mix two integers into one 32-bit seed (used for retry attempts and sub-streams). */
function hashSeed(a, b) {
    let h = Math.imul((a | 0) ^ 0x9E3779B9, 0x85EBCA6B);
    h ^= Math.imul((b | 0) + 0x632BE5AB, 0xC2B2AE35);
    h ^= h >>> 16;
    h = Math.imul(h, 0x7FEB352D);
    h ^= h >>> 15;
    return h >>> 0;
}

/* Random integer in [lo, hi]. */
function randInt(rng, lo, hi) {
    return lo + Math.floor(rng() * (hi - lo + 1));
}

/* Weighted random key from an object of {key: weight}. */
function weightedPick(rng, weights) {
    let total = 0;
    for (const k in weights) total += weights[k];
    let x = rng() * total;
    for (const k in weights) {
        x -= weights[k];
        if (x < 0) return k;
    }
    return Object.keys(weights)[0];
}

/* ---------- Level config ---------- */

/* Difficulty tier settings shared by levels and the daily challenge. */
const TIERS = {
    tutorial: { difficulty: 'Normal', hearts: 3, lenMin: 2, lenMax: 7, depthBias: 0,
        styles: { straight: 3, L: 3, U: 1 } },
    normal: { difficulty: 'Normal', hearts: 3, lenMin: 2, lenMax: 10, depthBias: 0.15,
        styles: { straight: 2, L: 3, U: 2, zigzag: 1, spiral: 1, snake: 2 } },
    hard: { difficulty: 'Hard', hearts: 4, lenMin: 2, lenMax: 14, depthBias: 0.35,
        styles: { straight: 1, L: 2, U: 2, zigzag: 2, spiral: 2, snake: 3 } },
    superHard: { difficulty: 'Super Hard', hearts: 4, lenMin: 3, lenMax: 20, depthBias: 0.55,
        styles: { straight: 1, L: 2, U: 2, zigzag: 2, spiral: 2, snake: 4 } }
};

/* Board size, tier and mask for a level number. */
function getLevelConfig(n) {
    const rng = mulberry32(hashSeed(n, 0x51ED));
    let tier, size, maxSize;
    if (n <= 5) { tier = 'tutorial'; size = n <= 3 ? 5 : 6; maxSize = size; }
    else if (n <= 20) { tier = 'normal'; size = 7 + Math.floor((n - 6) / 5); maxSize = 9; }
    else if (n <= 50) { tier = 'hard'; size = 10 + Math.floor((n - 21) / 8); maxSize = 13; }
    else { tier = 'superHard'; size = Math.min(16, 14 + Math.floor((n - 51) / 20)); maxSize = 16; }
    const mask = n % 10 === 0 ? MASK_SHAPES[(n / 10 - 1) % MASK_SHAPES.length] : null;
    let rows = size, cols = size;
    if (mask) { rows = cols = maxSize; }
    else if (n > 5 && rng() < 0.5) rows = Math.min(maxSize, size + 1);
    const cfg = Object.assign({}, TIERS[tier], { tier, rows, cols, mask, seed: n });
    if (tier === 'tutorial') { cfg.arrowsMin = 4; cfg.arrowsMax = 8; }
    return cfg;
}

/* Convert a Date (local time) to a YYYYMMDD integer. */
function dateKey(date) {
    return date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
}

/* Super Hard config for the daily challenge, seeded by a YYYYMMDD key. */
function getDailyConfig(key) {
    const rng = mulberry32(hashSeed(key, 0xDA11));
    const useMask = rng() < 0.3;
    const mask = useMask ? MASK_SHAPES[Math.floor(rng() * MASK_SHAPES.length)] : null;
    const size = mask ? 15 : 14;
    const rows = mask ? size : size + (rng() < 0.5 ? 1 : 0);
    return Object.assign({}, TIERS.superHard, { tier: 'superHard', rows, cols: size, mask, seed: 1e8 + key });
}

/* ---------- Masks ---------- */

/* Point-in-polygon test (even-odd rule). */
function insidePolygon(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
}

/* Is the normalized point (x, y in [-1, 1], y pointing down) inside the named shape? */
function insideShape(shape, x, y) {
    switch (shape) {
        case 'circle': return x * x + y * y <= 1.02;
        case 'diamond': return Math.abs(x) + Math.abs(y) <= 1.1;
        case 'hourglass': return Math.abs(x) <= Math.abs(y) + 0.22;
        case 'heart': {
            const X = x * 1.15, Y = -y * 1.2 + 0.12;
            const q = X * X + Y * Y - 1;
            return q * q * q - X * X * Y * Y * Y <= 0;
        }
        case 'star': {
            const poly = [];
            for (let i = 0; i < 10; i++) {
                const ang = -Math.PI / 2 + i * Math.PI / 5;
                const rad = i % 2 === 0 ? 1.12 : 0.56;
                poly.push([Math.cos(ang) * rad, Math.sin(ang) * rad + 0.12]);
            }
            return insidePolygon(x, y, poly);
        }
        default: return true;
    }
}

/* Build a 0/1 usable-cell array for a mask shape. Cells with no usable neighbour are dropped. */
function makeMask(shape, rows, cols) {
    const m = new Array(rows * cols).fill(1);
    if (!shape) return m;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const x = (c + 0.5) / cols * 2 - 1, y = (r + 0.5) / rows * 2 - 1;
            m[r * cols + c] = insideShape(shape, x, y) ? 1 : 0;
        }
    }
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (!m[r * cols + c]) continue;
            let n = 0;
            for (const d of DIRS) {
                const rr = r + d.dr, cc = c + d.dc;
                if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && m[rr * cols + cc]) n++;
            }
            if (n === 0) m[r * cols + c] = 0;
        }
    }
    return m;
}

/* ---------- Generator ---------- */

/* Relative turn plan for a shape style. Each entry is the turn before that step: 0 straight, 1 right, 3 left. */
function makePlan(style, len, rng) {
    const plan = new Array(len + 2).fill(0);
    const t = rng() < 0.5 ? 1 : 3, u = 4 - t;
    if (style === 'L') {
        plan[randInt(rng, 1, Math.max(1, len - 3))] = t;
    } else if (style === 'U') {
        const a = randInt(rng, 1, 4), b = randInt(rng, 1, 2);
        plan[a] = t; plan[a + b] = t;
    } else if (style === 'zigzag') {
        const h = randInt(rng, 1, 2), w = randInt(rng, 1, 2);
        const unit = [t].concat(new Array(h - 1).fill(0), [u], new Array(w - 1).fill(0),
            [u], new Array(h - 1).fill(0), [t], new Array(w - 1).fill(0));
        for (let i = randInt(rng, 0, 1), k = 0; i < plan.length; i++, k++) plan[i] = unit[k % unit.length];
    } else if (style === 'spiral') {
        let seg = randInt(rng, 3, 5), i = seg, repeat = 1;
        while (i < plan.length && seg > 0) {
            plan[i] = t;
            i += seg;
            if (repeat === 0) { seg--; repeat = 1; } else repeat = 0;
        }
    } else if (style === 'snake') {
        for (let i = 1; i < plan.length; i++) {
            const x = rng();
            plan[i] = x < 0.6 ? 0 : x < 0.8 ? 1 : 3;
        }
    }
    return plan;
}

/* Generate one candidate board with reverse peeling. Returns a level or null. */
function buildLevel(cfg, rng) {
    const rows = cfg.rows, cols = cfg.cols, N = rows * cols;
    const usable = makeMask(cfg.mask, rows, cols);
    const free = Uint8Array.from(usable);          // 1 = usable and not yet taken
    const owner = new Int16Array(N).fill(-1);
    const arrows = [];
    const inB = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols;
    const isFree = (r, c) => inB(r, c) && free[r * cols + c] === 1;
    const degree = (r, c) => {
        let n = 0;
        for (const d of DIRS) if (isFree(r + d.dr, c + d.dc)) n++;
        return n;
    };
    const take = (r, c, id) => { free[r * cols + c] = 0; owner[r * cols + c] = id; };

    // Grow the body away from the head following the style plan.
    function grow(head, dir, targetLen, style) {
        const id = arrows.length;
        const neck = { r: head.r - DIRS[dir].dr, c: head.c - DIRS[dir].dc };
        const path = [head, neck];
        take(head.r, head.c, id); take(neck.r, neck.c, id);
        const plan = makePlan(style, targetLen, rng);
        let heading = (dir + 2) % 4, step = 1;
        while (path.length < targetLen) {
            const cur = path[path.length - 1];
            const opts = [];
            for (let k = 0; k < 4; k++) if (isFree(cur.r + DIRS[k].dr, cur.c + DIRS[k].dc)) opts.push(k);
            if (!opts.length) break;
            // A neighbour that would be left alone forever is absorbed right away
            const orphan = opts.find(k => degree(cur.r + DIRS[k].dr, cur.c + DIRS[k].dc) === 0);
            const want = (heading + plan[Math.min(step, plan.length - 1)]) % 4;
            step++;
            let next;
            if (orphan !== undefined && path.length >= cfg.lenMin) next = orphan;
            else if (opts.indexOf(want) !== -1) next = want;
            else {
                if (style !== 'snake' && path.length >= Math.max(3, cfg.lenMin) && rng() < 0.3) break;
                let best = Infinity;
                for (const k of opts) {
                    const s = degree(cur.r + DIRS[k].dr, cur.c + DIRS[k].dc) + (k === heading ? -0.4 : 0) + rng() * 0.6;
                    if (s < best) { best = s; next = k; }
                }
            }
            const nr = cur.r + DIRS[next].dr, nc = cur.c + DIRS[next].dc;
            take(nr, nc, id);
            path.push({ r: nr, c: nc });
            heading = next;
        }
        arrows.push({ id, dir, path });
    }

    for (;;) {
        // Every free cell whose way out crosses only taken/unused cells can become a head
        const cands = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (!free[r * cols + c]) continue;
                for (let d = 0; d < 4; d++) {
                    if (!isFree(r - DIRS[d].dr, c - DIRS[d].dc)) continue;
                    let rr = r + DIRS[d].dr, cc = c + DIRS[d].dc, depth = 0, ok = true;
                    while (inB(rr, cc)) {
                        const i = rr * cols + cc;
                        if (free[i]) { ok = false; break; }
                        if (owner[i] !== -1) depth++;
                        rr += DIRS[d].dr; cc += DIRS[d].dc;
                    }
                    if (!ok) continue;
                    const score = degree(r, c) - depth * cfg.depthBias + rng() * 1.2;
                    cands.push({ r, c, d, score });
                }
            }
        }
        if (!cands.length) break;
        cands.sort((a, b) => a.score - b.score);
        const pickC = cands[Math.floor(rng() * Math.min(3, cands.length))];
        const span = cfg.lenMax - cfg.lenMin;
        const targetLen = cfg.lenMin + Math.round(span * (0.25 + 0.75 * rng()) * (0.5 + 0.5 * rng()));
        grow({ r: pickC.r, c: pickC.c }, pickC.d, Math.max(2, targetLen), weightedPick(rng, cfg.styles));
    }

    // Leftover cells join a neighbouring tail (they sit in no arrow's way out, so solvability holds)
    let changed = true;
    while (changed) {
        changed = false;
        for (let i = 0; i < N; i++) {
            if (!free[i]) continue;
            const r = Math.floor(i / cols), c = i % cols;
            for (const d of DIRS) {
                const rr = r + d.dr, cc = c + d.dc;
                if (!inB(rr, cc)) continue;
                const a = arrows[owner[rr * cols + cc]];
                if (!a || a.path.length >= cfg.lenMax) continue;
                const tail = a.path[a.path.length - 1];
                if (tail.r === rr && tail.c === cc) {
                    a.path.push({ r, c });
                    take(r, c, a.id);
                    changed = true;
                    break;
                }
            }
        }
    }

    let used = 0, total = 0;
    for (let i = 0; i < N; i++) { total += usable[i]; if (owner[i] !== -1) used++; }
    return {
        rows, cols,
        mask: cfg.mask ? usable : null,
        shape: cfg.mask,
        difficulty: cfg.difficulty,
        hearts: cfg.hearts,
        fill: used / total,
        arrows
    };
}

/* Does a level meet the tier's size rules (fill, arrow count)? */
function meetsConstraints(level, cfg) {
    if (level.fill < MIN_FILL) return false;
    if (cfg.arrowsMin && level.arrows.length < cfg.arrowsMin) return false;
    if (cfg.arrowsMax && level.arrows.length > cfg.arrowsMax) return false;
    return level.arrows.every(a => a.path.length >= MIN_LEN && a.path.length <= MAX_LEN);
}

/* Generate a verified level from a config. Failed attempts retry with the next derived seed. */
function generateFromConfig(cfg) {
    for (let attempt = 0; attempt < 500; attempt++) {
        const rng = mulberry32(hashSeed(cfg.seed, attempt));
        const level = buildLevel(cfg, rng);
        if (!meetsConstraints(level, cfg)) continue;
        if (!solveLevel(level).solvable) continue;
        level.seed = cfg.seed;
        level.attempt = attempt;
        return level;
    }
    throw new Error('Could not generate level for seed ' + cfg.seed);
}

/* Level n, always identical for the same n. */
function generateLevel(n) {
    const level = generateFromConfig(getLevelConfig(n));
    level.number = n;
    return level;
}

/* Daily challenge for a YYYYMMDD key. */
function generateDaily(key) {
    const level = generateFromConfig(getDailyConfig(key));
    level.daily = key;
    return level;
}

/* ---------- Solver ---------- */

/* Build the occupancy array (cell -> arrow id, -1 = empty). */
function buildOccupancy(level) {
    const occ = new Int16Array(level.rows * level.cols).fill(-1);
    for (const a of level.arrows) for (const p of a.path) occ[p.r * level.cols + p.c] = a.id;
    return occ;
}

/* First arrow cell in front of a head: {id, dist} (dist = empty cells before it), or null if clear. */
function rayBlocker(occ, rows, cols, head, dir) {
    const d = DIRS[dir];
    let r = head.r + d.dr, c = head.c + d.dc, dist = 0;
    while (r >= 0 && r < rows && c >= 0 && c < cols) {
        const id = occ[r * cols + c];
        if (id !== -1) return { id, dist };
        r += d.dr; c += d.dc; dist++;
    }
    return null;
}

/* Ids of arrows that can escape right now. */
function freeArrows(occ, level, removed) {
    const out = [];
    for (const a of level.arrows) {
        if (removed && removed[a.id]) continue;
        if (!rayBlocker(occ, level.rows, level.cols, a.path[0], a.dir)) out.push(a.id);
    }
    return out;
}

/* Greedy solver. Removing an arrow only frees cells, so greedy removal solves any solvable board. */
function solveLevel(level) {
    const occ = buildOccupancy(level);
    const removed = new Uint8Array(level.arrows.length);
    const order = [];
    let rounds = 0;
    for (;;) {
        const free = freeArrows(occ, level, removed);
        if (!free.length) break;
        rounds++;
        for (const id of free) {
            removed[id] = 1;
            order.push(id);
            for (const p of level.arrows[id].path) occ[p.r * level.cols + p.c] = -1;
        }
    }
    return { solvable: order.length === level.arrows.length, order, rounds };
}

/* Full structural check used by tests. Returns a list of problems (empty = valid). */
function validateLevel(level) {
    const errs = [];
    const seen = new Int16Array(level.rows * level.cols).fill(-1);
    level.arrows.forEach((a, idx) => {
        if (a.id !== idx) errs.push('bad id ' + a.id);
        if (a.path.length < MIN_LEN || a.path.length > MAX_LEN) errs.push('arrow ' + idx + ' length ' + a.path.length);
        a.path.forEach((p, i) => {
            if (p.r < 0 || p.r >= level.rows || p.c < 0 || p.c >= level.cols) { errs.push('out of bounds'); return; }
            const k = p.r * level.cols + p.c;
            if (level.mask && !level.mask[k]) errs.push('arrow ' + idx + ' outside mask');
            if (seen[k] !== -1) errs.push('cell overlap at ' + p.r + ',' + p.c);
            seen[k] = idx;
            if (i > 0 && Math.abs(p.r - a.path[i - 1].r) + Math.abs(p.c - a.path[i - 1].c) !== 1) errs.push('arrow ' + idx + ' not contiguous');
        });
        const d = DIRS[a.dir];
        if (!d || a.path[0].r - a.path[1].r !== d.dr || a.path[0].c - a.path[1].c !== d.dc) errs.push('arrow ' + idx + ' bad direction');
    });
    if (level.fill < MIN_FILL) errs.push('fill ' + level.fill.toFixed(2));
    if (!solveLevel(level).solvable) errs.push('not solvable');
    return errs;
}

if (typeof module !== 'undefined') {
    module.exports = {
        DIRS, MASK_SHAPES, mulberry32, hashSeed, getLevelConfig, getDailyConfig, dateKey, makeMask,
        buildLevel, generateLevel, generateDaily, buildOccupancy, rayBlocker, freeArrows, solveLevel, validateLevel
    };
}

<!-- ===================== GAME ===================== -->
<script>
'use strict';

/* ---------- Config ---------- */
const CELL = 100;            // SVG units per grid cell
const SVG_NS = 'http://www.w3.org/2000/svg';
const HIT_FALLBACK = 0.3;    // fallback hit radius, in cells

/* ---------- State ---------- */
const state = {
    levelNum: 1,
    level: null,       // generated level (never mutated)
    arrows: [],        // live arrows: {id, dir, path, escaped, busy, el, shaft, headEl, geom}
    occ: null,         // live occupancy
    remaining: 0,
    hearts: 3,
    maxHearts: 3,
    locked: false,     // blocks board input (modals, game over)
    sound: true
};

/* ---------- Renderer ---------- */

/* Stroke and head sizes in SVG units, thinner on big boards. */
function strokeMetrics(cols, rows) {
    const n = Math.max(cols, rows);
    const sw = n <= 6 ? 17 : n <= 9 ? 16 : n <= 12 ? 15 : 14;
    const k = sw / 16;
    return { sw, hw: 24 * k, back: 14 * k, tip: 22 * k };
}

/* Precompute the polyline (tail -> head -> far outside) and lengths used for drawing and animating. */
function arrowGeometry(arrow, m, rows, cols) {
    const pts = [];
    for (let i = arrow.path.length - 1; i >= 0; i--) {
        pts.push({ x: (arrow.path[i].c + 0.5) * CELL, y: (arrow.path[i].r + 0.5) * CELL });
    }
    const d = DIRS[arrow.dir];
    const head = pts[pts.length - 1];
    const bodyLen = (arrow.path.length - 1) * CELL;   // tail center -> head center
    const far = (rows + cols + arrow.path.length + 2) * CELL;
    pts.push({ x: head.x + d.dc * far, y: head.y + d.dr * far });
    // Cells between head and board edge, to compute the exit distance
    const toEdge = d.dr === -1 ? arrow.path[0].r : d.dr === 1 ? rows - 1 - arrow.path[0].r
        : d.dc === -1 ? arrow.path[0].c : cols - 1 - arrow.path[0].c;
    return {
        pts,
        d: 'M' + pts.map(p => p.x + ' ' + p.y).join(' L'),
        dashLen: bodyLen - m.back + 2,
        hx: head.x, hy: head.y,
        dx: d.dc, dy: d.dr, rot: d.rot,
        toEdge
    };
}

/* Create one <g> per arrow inside the given svg. */
function drawArrows(svg, arrows, level, withDots) {
    const rows = level.rows, cols = level.cols;
    svg.textContent = '';
    svg.setAttribute('viewBox', `0 0 ${cols * CELL} ${rows * CELL}`);
    const m = strokeMetrics(cols, rows);
    if (withDots) {
        const dots = document.createElementNS(SVG_NS, 'path');
        dots.setAttribute('class', 'dots');
        let d = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (level.mask && !level.mask[r * cols + c]) continue;
                const x = (c + 0.5) * CELL - 4.5, y = (r + 0.5) * CELL;
                d += `M${x} ${y}a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0`;
            }
        }
        dots.setAttribute('d', d);
        svg.appendChild(dots);
    }
    const layer = document.createElementNS(SVG_NS, 'g');
    arrows.forEach(a => {
        const g = arrowGeometry(a, m, rows, cols);
        const el = document.createElementNS(SVG_NS, 'g');
        el.setAttribute('class', 'arrow');
        const shaft = document.createElementNS(SVG_NS, 'path');
        shaft.setAttribute('class', 'shaft');
        shaft.setAttribute('d', g.d);
        shaft.setAttribute('stroke-width', m.sw);
        shaft.setAttribute('stroke-dasharray', `${g.dashLen} 1000000`);
        shaft.setAttribute('stroke-dashoffset', '0');
        const head = document.createElementNS(SVG_NS, 'polygon');
        head.setAttribute('class', 'head');
        head.setAttribute('points', `${-m.hw},${m.back} ${m.hw},${m.back} 0,${-m.tip}`);
        head.setAttribute('stroke-width', 3.5);
        el.append(shaft, head);
        layer.appendChild(el);
        a.el = el; a.shaft = shaft; a.headEl = head; a.geom = g;
        setArrowOffset(a, 0);
    });
    svg.appendChild(layer);
    return m;
}

/* Move an arrow s units along its own path (snake movement). */
function setArrowOffset(a, s) {
    const g = a.geom;
    a.shaft.setAttribute('stroke-dashoffset', -s);
    a.headEl.setAttribute('transform', `translate(${g.hx + g.dx * s} ${g.hy + g.dy * s}) rotate(${g.rot})`);
}

/* Fit the board svg into the available area. */
function layoutBoard() {
    if (!state.level) return;
    const wrap = document.getElementById('board-wrap');
    const cs = getComputedStyle(wrap);
    const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const cell = Math.max(8, Math.floor(Math.min(w / state.level.cols, h / state.level.rows, 64)));
    const svg = document.getElementById('board');
    svg.setAttribute('width', cell * state.level.cols);
    svg.setAttribute('height', cell * state.level.rows);
}

/* ---------- Input ---------- */

/* Squared distance from a point to a segment. */
function distSq(px, py, x1, y1, x2, y2) {
    const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
    let t = l2 === 0 ? 0 : ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = Math.max(0, Math.min(1, t));
    return (px - x1 - t * (x2 - x1)) ** 2 + (py - y1 - t * (y2 - y1)) ** 2;
}

/* Find the arrow under a pointer: exact cell first, then a small radius around lines. */
function pickArrow(clientX, clientY) {
    const svg = document.getElementById('board');
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return null;
    const { rows, cols } = state.level;
    const x = (clientX - rect.left) / rect.width * cols * CELL;
    const y = (clientY - rect.top) / rect.height * rows * CELL;
    const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
    if (r >= 0 && r < rows && c >= 0 && c < cols) {
        const id = state.occ[r * cols + c];
        if (id !== -1) return state.arrows[id];
    }
    let best = null, bestD = (HIT_FALLBACK * CELL) ** 2;
    for (const a of state.arrows) {
        if (a.escaped) continue;
        const p = a.geom.pts;
        // body segments plus the head tip segment
        for (let i = 0; i < p.length - 2; i++) {
            const d = distSq(x, y, p[i].x, p[i].y, p[i + 1].x, p[i + 1].y);
            if (d < bestD) { bestD = d; best = a; }
        }
        const hx = a.geom.hx, hy = a.geom.hy;
        const d = distSq(x, y, hx, hy, hx + a.geom.dx * CELL * 0.45, hy + a.geom.dy * CELL * 0.45);
        if (d < bestD) { bestD = d; best = a; }
    }
    return best;
}

/* Board pointer handler. */
function onBoardPointer(e) {
    e.preventDefault();
    if (state.locked || state.hearts <= 0) return;
    const a = pickArrow(e.clientX, e.clientY);
    if (a && !a.escaped && !a.busy) tapArrow(a);
}

/* ---------- Game logic ---------- */

/* Load and draw a level. */
function startLevel(n) {
    state.levelNum = n;
    const lvl = generateLevel(n);
    state.level = lvl;
    state.arrows = lvl.arrows.map(a => ({ id: a.id, dir: a.dir, path: a.path, escaped: false, busy: false }));
    state.occ = buildOccupancy(lvl);
    state.remaining = lvl.arrows.length;
    state.maxHearts = lvl.hearts;
    state.hearts = lvl.hearts;
    state.locked = false;
    drawArrows(document.getElementById('board'), state.arrows, lvl, true);
    layoutBoard();
    document.getElementById('level-display').textContent = n;
    document.getElementById('diff-badge').textContent = lvl.difficulty;
    renderHearts(-1);
    updateRemaining();
}

/* Handle a tap on an arrow: escape or bump. */
function tapArrow(a) {
    initAudio();
    const lvl = state.level;
    const block = rayBlocker(state.occ, lvl.rows, lvl.cols, a.path[0], a.dir);
    if (!block) {
        a.escaped = true;
        a.path.forEach(p => { state.occ[p.r * lvl.cols + p.c] = -1; });
        state.remaining--;
        updateRemaining();
        playSound('pop');
        animateEscape(a).then(() => {
            a.el.remove();
            if (state.remaining === 0) onLevelWon();
        });
    } else {
        a.busy = true;
        playSound('bump');
        state.hearts = Math.max(0, state.hearts - 1);
        renderHearts(state.hearts);
        if (state.hearts === 0) state.locked = true;
        animateBlocked(a, block).then(() => {
            a.busy = false;
            if (state.hearts === 0) setTimeout(() => openModal('modal-gameover'), 150);
        });
    }
}

/* Update the arrows-left counter. */
function updateRemaining() {
    document.getElementById('remaining-display').textContent = state.remaining;
}

/* Draw hearts; the heart at popIndex animates. */
function renderHearts(popIndex) {
    const box = document.getElementById('hearts');
    box.textContent = '';
    for (let i = 0; i < state.maxHearts; i++) {
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('class', 'heart' + (i < state.hearts ? '' : ' lost') + (i === popIndex ? ' pop' : ''));
        svg.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
        box.appendChild(svg);
    }
}

/* Level cleared. */
function onLevelWon() {
    state.locked = true;
    playSound('win');
    setTimeout(() => {
        drawArrows(document.getElementById('mini-board'),
            state.level.arrows.map(a => ({ id: a.id, dir: a.dir, path: a.path })), state.level, false);
        openModal('modal-victory');
        startConfetti();
    }, 200);
}

/* ---------- Animations ---------- */

/* Run a rAF tween from 0 to 1, calling step(eased t). */
function tween(duration, ease, step) {
    return new Promise(resolve => {
        const t0 = performance.now();
        function frame(now) {
            const t = Math.min(1, (now - t0) / duration);
            step(ease(t));
            if (t < 1) requestAnimationFrame(frame); else resolve();
        }
        requestAnimationFrame(frame);
    });
}
const easeIn = t => t * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);

/* Slide the arrow along its path and out of the board. */
function animateEscape(a) {
    const g = a.geom;
    const dist = g.dashLen + (g.toEdge + 1.5) * CELL;
    const dur = Math.max(260, Math.min(450, 200 + dist * 0.08));
    a.el.classList.add('out');
    return tween(dur, easeIn, t => {
        setArrowOffset(a, dist * t);
        if (t > 0.6) a.el.style.opacity = String(1 - (t - 0.6) / 0.4);
    });
}

/* Move forward to the blocker, flash red, slide back. */
function animateBlocked(a, block) {
    const m = strokeMetrics(state.level.cols, state.level.rows);
    const hit = (block.dist + 1) * CELL - m.sw / 2 - m.tip;
    const fwd = Math.min(300, 140 + block.dist * 25);
    return tween(fwd, easeIn, t => setArrowOffset(a, hit * t))
        .then(() => {
            a.el.classList.add('err');
            const other = state.arrows[block.id];
            if (other && other.el) bump(other.el, a.geom.dx, a.geom.dy);
            if (navigator.vibrate) navigator.vibrate(60);
            return tween(260, easeOut, t => setArrowOffset(a, hit * (1 - t)));
        })
        .then(() => new Promise(res => setTimeout(res, 120)))
        .then(() => a.el.classList.remove('err'));
}

/* Small nudge on the arrow that was hit. */
function bump(el, dx, dy) {
    tween(180, t => t, t => {
        const k = Math.sin(t * Math.PI) * 6;
        el.setAttribute('transform', `translate(${dx * k} ${dy * k})`);
    }).then(() => el.removeAttribute('transform'));
}

/* Confetti burst on the victory screen. */
let confettiId = 0;
function startConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth; canvas.height = innerHeight;
    const colors = ['#FF473E', '#FFD23F', '#3DDC97', '#FFFFFF', '#9B7BFF'];
    const parts = [];
    for (let i = 0; i < 90; i++) {
        parts.push({
            x: canvas.width / 2, y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4,
            s: Math.random() * 7 + 4, c: colors[i % colors.length],
            a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3
        });
    }
    cancelAnimationFrame(confettiId);
    (function frame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of parts) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.a += p.va;
            if (p.y < canvas.height + 20) alive = true;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
            ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
            ctx.restore();
        }
        if (alive) confettiId = requestAnimationFrame(frame);
    })();
}

/* ---------- Audio ---------- */
let audioCtx = null;

/* Create/resume the audio context on first user gesture. */
function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AC) audioCtx = new AC();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

/* Play one short tone. */
function tone(freq, endFreq, type, start, dur, vol) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
}

/* Play a named sound effect. */
function playSound(type) {
    if (!state.sound) return;
    try {
        initAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        if (type === 'pop') tone(520, 900, 'sine', t, 0.1, 0.25);
        else if (type === 'bump') tone(150, 70, 'triangle', t, 0.18, 0.35);
        else if (type === 'win') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0, 'sine', t + i * 0.11, 0.22, 0.22));
    } catch (e) { /* audio not available */ }
}

/* ---------- UI ---------- */

/* Open a modal and lock board input. */
function openModal(id) {
    document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
    document.getElementById(id).classList.add('open');
    state.locked = true;
}

/* Close all modals; unlock the board if the game is still running. */
function closeModals() {
    document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
    state.locked = state.hearts <= 0 || state.remaining === 0;
}

/* Level list with infinite scroll. */
let levelListCount = 0;
function openLevels() {
    const grid = document.getElementById('level-grid');
    grid.textContent = '';
    levelListCount = 0;
    appendLevels(Math.max(60, Math.ceil((state.levelNum + 20) / 4) * 4));
    openModal('modal-levels');
    const cur = grid.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
}

/* Add more level buttons to the list. */
function appendLevels(count) {
    const grid = document.getElementById('level-grid');
    const frag = document.createDocumentFragment();
    for (let i = levelListCount + 1; i <= levelListCount + count; i++) {
        const b = document.createElement('button');
        b.className = 'level-btn' + (i === state.levelNum ? ' current' : '');
        b.textContent = i;
        b.dataset.level = i;
        frag.appendChild(b);
    }
    levelListCount += count;
    grid.appendChild(frag);
}

/* Wire up all buttons. */
function bindUI() {
    const board = document.getElementById('board');
    board.addEventListener('pointerdown', onBoardPointer);
    document.getElementById('btn-levels').addEventListener('click', openLevels);
    document.getElementById('btn-settings').addEventListener('click', () => openModal('modal-settings'));
    document.getElementById('btn-restart').addEventListener('click', () => { closeModals(); startLevel(state.levelNum); });
    document.getElementById('btn-audio').addEventListener('click', e => {
        state.sound = !state.sound;
        e.currentTarget.textContent = 'Sound: ' + (state.sound ? 'ON' : 'OFF');
    });
    document.getElementById('btn-tryagain').addEventListener('click', () => { closeModals(); startLevel(state.levelNum); });
    document.getElementById('btn-next').addEventListener('click', () => { closeModals(); startLevel(state.levelNum + 1); });
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModals));
    const grid = document.getElementById('level-grid');
    grid.addEventListener('click', e => {
        const b = e.target.closest('.level-btn');
        if (!b) return;
        closeModals();
        startLevel(Number(b.dataset.level));
    });
    grid.addEventListener('scroll', () => {
        if (grid.scrollTop + grid.clientHeight > grid.scrollHeight - 200) appendLevels(60);
    });
    window.addEventListener('resize', layoutBoard);
}

bindUI();
startLevel(1);
</script>
