name: android-release

# Builds the Android app (see docs/RELEASE.md):
#  - release-aab: web app in release mode (TEST_UNLOCK_ALL always off), signed with the upload key from
#    GitHub Secrets -> app-release.aab for Google Play
#  - debug-apk: an APK to install on a phone for testing (signed with Gradle's debug key)
# Manual run (Actions tab), or a version tag (v*) for a release. Pull requests that touch the Android project
# build the debug APK only, to check the build still works (no secrets needed).
on:
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        options: [both, release-aab, debug-apk]
        default: both
      debug_test_mode:
        description: Debug APK with every level unlocked (TEST MODE badge on Home)
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'
      - 'scripts/verify-apk.sh'
      - 'scripts/check-apk-manifest.py'
      - 'scripts/android-smoke.*'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      debug: ${{ steps.what.outputs.debug }}
      apk_name: ${{ steps.apk.outputs.name }}
      apk_sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # the action's default list includes the old 'tools' package, which no longer exists
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci

      - name: What to build
        id: what
        run: |
          case "${{ github.event_name }}" in
            pull_request) BUILD=debug-apk ;;
            push) BUILD=both ;;
            *) BUILD="${{ inputs.build }}" ;;
          esac
          echo "release=$([ "$BUILD" != debug-apk ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "debug=$([ "$BUILD" != release-aab ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./package.json').androidVersionCode")" >> "$GITHUB_OUTPUT"

      # ---------- signed release AAB ----------
      - name: Check the signing secrets
        if: steps.what.outputs.release == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing (see docs/RELEASE.md, step 2)"
            exit 1
          fi
      - name: Web app (release mode)
        if: steps.what.outputs.release == 'true'
        run: |
          npm run build:release
          grep -q 'test-unlock=false' dist/index.html
      - name: Sync Capacitor
        if: steps.what.outputs.release == 'true'
        run: npx cap sync android
      - name: Signed release AAB
        if: steps.what.outputs.release == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > /dev/null
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/arrow-expert-${{ steps.what.outputs.version }}-${{ steps.what.outputs.code }}.aab"
      - uses: actions/upload-artifact@v4
        if: steps.what.outputs.release == 'true'
        with:
          name: arrow-expert-${{ steps.what.outputs.version }}-${{ steps.what.outputs.code }}-release-aab
          path: ${{ runner.temp }}/arrow-expert-*.aab
          if-no-files-found: error

      # ---------- debug APK for a test phone ----------
      - name: Web app (debug APK)
        if: steps.what.outputs.debug == 'true'
        run: |
          # the debug APK always uses Google's test ad IDs (ARROW_TEST_ADS=1), never the real ones
          export ARROW_TEST_ADS=1
          if [ "${{ inputs.debug_test_mode }}" = "true" ]; then ARROW_TEST_UNLOCK=1 npm run build; else npm run build:release; fi
      - name: Sync Capacitor (debug)
        if: steps.what.outputs.debug == 'true'
        run: npx cap sync android
      - name: Debug APK
        if: steps.what.outputs.debug == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -l app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/arrow-expert-${{ steps.what.outputs.version }}-debug.apk"
      # Fails the job unless the APK is a valid zip, signed with v2, readable by aapt2, not testOnly, and every
      # component with an intent-filter sets android:exported (Android 12+).
      - name: Verify the APK (apksigner, aapt2, manifest)
        id: apk
        if: steps.what.outputs.debug == 'true'
        env:
          # the fixed debug key in android/app/debug.keystore: every debug APK must be signed with it
          EXPECT_CERT_SHA256: 872feba347c32ef53557e464b65829cddbf46d37eb60e43c7715d535e049dd84
          # debug APKs always carry Google's test AdMob App ID (src/ads.config.json test.appId)
          EXPECT_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
        run: |
          APK="$RUNNER_TEMP/arrow-expert-${{ steps.what.outputs.version }}-debug.apk"
          scripts/verify-apk.sh "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          NAME=$(basename "$APK")
          (cd "$RUNNER_TEMP" && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Debug APK"
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`$NAME\` | $SIZE bytes ($(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}") MiB) | \`$SHA\` |"
            echo
            echo "The download is a .zip: unzip it, then compare the APK's size and SHA-256 with the line above."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK $NAME size=$SIZE sha256=$SHA"
      - uses: actions/upload-artifact@v4
        if: steps.what.outputs.debug == 'true'
        with:
          name: arrow-expert-${{ steps.what.outputs.version }}-debug-apk
          path: |
            ${{ runner.temp }}/arrow-expert-*-debug.apk
            ${{ runner.temp }}/arrow-expert-*-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0 # an APK is already compressed

  # Download the uploaded artifact again and check the APK inside is byte-for-byte the one that was verified.
  artifact-check:
    needs: android
    if: needs.android.outputs.debug == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arrow-expert-*-debug-apk
          path: dl
      - name: Compare the downloaded APK with the built one
        run: |
          find dl -type f -exec ls -l {} \;
          APK=$(find dl -name '${{ needs.android.outputs.apk_name }}' | head -1)
          [ -n "$APK" ] || { echo "::error::APK not found in the artifact"; exit 1; }
          GOT=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "built:      ${{ needs.android.outputs.apk_sha256 }}"
          echo "downloaded: $GOT"
          [ "$GOT" = "${{ needs.android.outputs.apk_sha256 }}" ] || { echo "::error::the artifact APK differs from the built APK"; exit 1; }
          (cd "$(dirname "$APK")" && sha256sum -c ./*.sha256)
          unzip -tq "$APK"
          echo "artifact APK: OK (same bytes as the verified build)"

  # Smoke test on an Android emulator: install the debug APK, open it, play level 1 through the WebView (DevTools
  # protocol) and check logcat for crashes, ANRs and app errors (scripts/android-smoke.sh). PRs and manual runs.
  emulator:
    needs: android
    if: needs.android.outputs.debug == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 34: Android 14; 36: Android 16, where apps targeting SDK 35+ are always edge-to-edge
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: arrow-expert-*-debug-apk
          path: dl
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator setup itself can fail now and then (SDK download cut off, slow boot). Such a failure is
      # retried once; a failure of the test (smoke/started exists) is never retried, so app bugs always show.
      - name: Play level 1 on an emulator (API ${{ matrix.api-level }})
        id: smoke1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh "$(find dl -name '${{ needs.android.outputs.apk_name }}' | head -1)" smoke
      - name: Emulator setup failed before the test started, trying once more
        id: setupfail
        if: steps.smoke1.outcome == 'failure'
        run: |
          if [ -f smoke/started ]; then
            echo "::error::the smoke test failed on the app (see the step above); not retried"
            exit 1
          fi
          echo "::warning::the emulator setup failed before the test started (download or boot); retrying once"
      - name: Play level 1 on an emulator, second try (API ${{ matrix.api-level }})
        if: steps.smoke1.outcome == 'failure' && steps.setupfail.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-smoke.sh "$(find dl -name '${{ needs.android.outputs.apk_name }}' | head -1)" smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-api${{ matrix.api-level }}
          path: smoke/
          if-no-files-found: warn
